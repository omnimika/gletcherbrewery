></div></div></div></div><div class="t921__col t-col t-col_7 t921__top-indent"><div class="t921__textwrapper t-align_left"><div class="t921__content t-valign_middle"><div class="t921__title t-title t-title_xs " field="title"><span style="color: rgb(255, 132, 98); font-weight: 900; font-size: 52px;">*</span> ФУДПЕЙРИНГ</div><div class="t921__descr t-descr t-descr_md " field="descr">— это инновационный подход, расширяющий границы создания рецептов. Благодаря нему появляется возможность использовать ингредиенты непривычным образом, но не наугад, а ориентируясь на их химические свойства.<br /><br /><span style="font-weight: 300; font-size: 16px; font-family: Roboto;">Foodpairing помогает шеф-поварам, барменам и даже бариста найти новые гармоничные сочетания вкусов, составить нестандартное меню или сочинить новое неповторимое блюдо или коктейль. Это целая наука о сочетании продуктов с разными вкусами и запахами, но обладающими общим вкусовым компонентом. Фудпейринг позволяет создавать уникальные авторские блюда с необычным сочетанием вкусов. Но самая интересная фишка фудпейринга в кулинарии заключается в том, что все расчеты и алгоритмы вычисляет искусственный интеллект.</span><br /><br /><span style="font-weight: 300; font-size: 16px; font-family: Roboto;">Фудпейринг определяет каждый ингредиент как набор разных ароматов, при этом один-два из которых доминируют. Например, огурец сочетает в себе несколько десятков различных ароматов, однако, наиболее сильный из них, тот, который дает именно запах огурца — один. Т.е. тот аромат, который содержится в продукте в более высокой концентрации, чем другие, является ключевым. На основе ключевого аромата и составляется дерево сочетаний.</span><br /><br /><span style="font-weight: 300; font-size: 16px; font-family: Roboto;">Дерево сочетаний, оно же дерево фудпейринга — это схематичное изображение сочетаний ароматов. В центре дерева находится любой интересный нам ингредиент, а от него в разные стороны тянутся ветви — наборы наиболее подходящих продуктов. И вот здесь начинаются самые необычные и странные, но вкусные сочетания: горький шоколад с беконом или запеченная тыква с вишней.</span><br /><br /><span style="font-weight: 300; font-size: 16px; font-family: Roboto;">Foodpairing основан на принципах молекулярной кухни, которая вышла из фьюжн-кухни. Поэтому можно считать, что фудпейринг — не новое слово в кулинарии, а лишь вариация направления, зародившегося в 1970-е годы.</span></div></div></div></div></div></div></div><div id="rec506368043" class="r t-rec t-rec_pt_0 t-rec_pb_0" style="padding-top:0px;padding-bottom:0px; " data-animationappear="off" data-record-type="814" ><!-- t814 --><div class="t814"><div class="t-container"><div class="t814__top t-col t-col_6 " itemscope itemtype="http://schema.org/ImageObject"><meta itemprop="image" content="https://static.tildacdn.com/tild3335-3836-4539-a633-316336613735/062_.jpg"> <div class="t814__blockimg-wrapper" style="padding-bottom:125%;"><div class="t814__blockimg t-bgimg " data-original="https://static.tildacdn.com/tild3335-3836-4539-a633-316336613735/062_.jpg" 
bgimgfield="img"
style="background-image:url('https://thb.tildacdn.com/tild3335-3836-4539-a633-316336613735/-/resizeb/20x/062_.jpg');"
></div></div></div><div class="t-col t-col_6 " itemscope itemtype="http://schema.org/ImageObject"><meta itemprop="image" content="https://static.tildacdn.com/tild3335-3836-4539-a633-316336613735/062_.jpg"> <div class="t814__blocktext-wrapper"><div class="t814__blocktext t-align_left" style="background-color: #93cce6; right: 0;"><div class="t814__content t-valign_middle"><div class="t814__box"><div class="t814__title t-title t-title_xs " field="title"><p style="text-align: left;">ЧАСТНЫЕ И КОРПОРАТИВНЫЕ МЕРОПРИЯТИЯ:</p><p style="text-align: left;">Любые форматы и яркие эмоции</p></div><div class="t814__line" style="max-width: 300px;height: 5px;background-color: #ff8462;opacity:1;"></div><div class="t814__descr t-descr t-descr_md " field="descr">Проведение мероприятия на нашей площадке — это возможность сохранить положительные воспоминания о празднике на долгое время.<br /><br />Многие возвращаются к нам вновь, а также, рекомендуют нас своим друзьям и близким.<br /><br />Наше атмосферное пространство — мультиформатно и подходит под разные мероприятия – от деловых встреч и презентаций до свадеб и юбилеев.<br /><br />Вам не стоит беспокоиться об организации вашего мероприятия — мы с радостью поможем вам с этим!</div><div class="t814__btn-container"><div class="t814__btn-wrapper"><a href="tel:+79260216531" target="" class="t-btn t-btn_md " style="color:#263354;border:3px solid #ff8462;border-radius:30px; -moz-border-radius:30px; -webkit-border-radius:30px;" data-buttonfieldset="button"
