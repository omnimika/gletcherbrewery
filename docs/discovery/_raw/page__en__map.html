        max-width: 320px;

        border-left: 3px solid #0d0f49;;
        border-bottom: 3px solid #0d0f49;;
        border-top: none;
        border-right: none;

    .map-controls {

        gap: 10px;
        margin-bottom: 15px;
        padding-bottom: 15px;

    }

        display: flex;
        flex-direction: row;
        gap: 0;
        width: 100%;
        justify-content: stretch;
        align-items: stretch;
    }

        background-color: #1c1c1c;
        border: none;

        display: flex;
        align-items: center;
        justify-content: center;
        width: 50%;
        font-size: 18px;
    }

    .control-btn:first-child {
        border-radius: 8px 0 0 8px;
        margin-right: 2px;
    }
    .control-btn:last-child {
        border-radius: 0 8px 8px 0;
        margin-left: 2px;
    }

    .control-btn:hover {
        background-color: #e5373c;
        color: white;
    }

    .control-btn svg {
        fill: currentColor;
    }

// MAPBOX GL JS MULILAYER FILTER FOR GLETCHER BREWERY
// BY MIKA SHLIMMER FROM OMNICORE AGENCY
mapboxgl.accessToken = 'REDACTED_MAPBOX_TOKEN';

document.addEventListener('DOMContentLoaded', () => {
  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/omnicoremaps/cknj3azmg0w2t17qqmylsfz8x',
    center: [50.291418, 53.343783],
    zoom: 3.52,
    projection: 'globe',
    antialias: true
  });

  const layers = [
    'auchan-atak', 'twoaxes-drinx-beruvykhodnoy', 'selgros-miratorg-yabloko-5m7m',
    'winelab', 'sparnew', 'dixie', 'metro-globus-okey', 'azbuka', 'perekrestok',
    'vkusvill', 'magnit', 'lenta', 'yarche'
  ];

  let selectedBeers = new Set();

  map.on('style.load', () => {
    // Fullscreen
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });

    // Geolocation
    const geolocateBtn = document.getElementById('geolocate-btn');
    const geolocateControl = new mapboxgl.GeolocateControl({
      positionOptions: { enableHighAccuracy: true },
      trackUserLocation: true,
      showUserHeading: true
    });
    map.addControl(geolocateControl);
    geolocateBtn.addEventListener('click', () => geolocateControl.trigger());

    // Geocoder
    const geocoderContainer = document.getElementById('geocoder');
    const geocoder = new MapboxGeocoder({
      accessToken: mapboxgl.accessToken,
      mapboxgl: mapboxgl,
      placeholder: '        Ввести адрес...',
      marker: false
    });
    geocoderContainer.appendChild(geocoder.onAdd(map));
  });

  // Показать все точки
  function showAllLayers() {
    layers.forEach(layerId => {
      map.setFilter(layerId, null);
      map.setLayoutProperty(layerId, 'visibility', 'visible');
    });
  }

  // Обновить фильтр
  function updateLayerFilters() {
    if (selectedBeers.size === 0) {
      showAllLayers();
      return;
    }
    layers.forEach(layerId => {
      const filter = [
        'any',
        ...Array.from(selectedBeers).map(beer => [
          'in',
          beer,
          ['coalesce', ['get', 'Product'], '']
        ])
      ];
      map.setFilter(layerId, filter);
      map.setLayoutProperty(layerId, 'visibility', 'visible');
    });
  }

  // Кнопки сортов
  const beerButtons = document.querySelectorAll('.beer-btn');
  beerButtons.forEach(button => {
    button.classList.remove('active');
    button.addEventListener('click', () => {
      const beer = button.dataset.beer;
      if (button.classList.contains('active')) {
        button.classList.remove('active');
        selectedBeers.delete(beer);
      } else {
        button.classList.add('active');
        selectedBeers.add(beer);
      }
      updateLayerFilters();
    });
  });

  // Двойной клик для сброса фильтра
  map.on('dblclick', (e) => {
    const features = map.queryRenderedFeatures(e.point, { layers });
    if (features.length === 0) {
      selectedBeers.clear();
      beerButtons.forEach(btn => btn.classList.remove('active'));
      showAllLayers();
    }
  });

  // Popup по клику
  map.on('click', (e) => {
    const featuresPop = map.queryRenderedFeatures(e.point, { layers });
    if (!featuresPop.length) return;

    e.originalEvent.cancelBubble = true; // предотвращаем всплытие события
    e.preventDefault?.();

    const featurePop = featuresPop[0];
    new mapboxgl.Popup({ offset: [0, -15] })
      .setLngLat(featurePop.geometry.coordinates)
      .setHTML(
        `<h2 style="color:#ff8462">${featurePop.properties.Title}</h2> <p>${featurePop.properties.Adress}</p> <p><u>Ассортимент:</u><br>${featurePop.properties.Product}</p>`
      )
      .addTo(map);
  });

  showAllLayers();
});

</script> <!-- nominify end --> </div> </div> </div> </div> <div id="rec802980859" class="r t-rec t-rec_pt_15 t-rec_pb_30" style="padding-top:15px;padding-bottom:30px; " data-record-type="296"> <!-- t265 --> <div class="t265"> <div class="t-container"> <div class="t-col t-col_10 t-prefix_1"> <div class="t265__wrapper" style="background:#ffffff;"> <div class="t265__icon"> <svg role="img" x="0px" y="0px" width="24px" height="24px" viewBox="0 0 24 24" style="enable-background:new 0 0 24 24;"> <circle style="fill:#e5373c;" cx="12.125" cy="12.125" r="12"/> <g> <path style="fill: #fff;" d="M10.922,6.486c0-0.728,0.406-1.091,1.217-1.091s1.215,0.363,1.215,1.091c0,0.347-0.102,0.617-0.304,0.81
